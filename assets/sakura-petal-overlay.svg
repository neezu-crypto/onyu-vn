<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="none">
  <style>
    .petal { fill: #f7b5ca; stroke: #fff3f7; stroke-width: 1.5; opacity: .88; transform-box: fill-box; transform-origin: center; animation: fall linear infinite; }
    @keyframes fall { 0% { transform: translate3d(0,-90px,0) rotate(0deg); opacity: 0; } 12% { opacity: .88; } 88% { opacity: .78; } 100% { transform: translate3d(100px,850px,0) rotate(420deg); opacity: 0; } }
    .p1{animation-duration:8s;animation-delay:-5s}.p2{animation-duration:10s;animation-delay:-8s}.p3{animation-duration:7.5s;animation-delay:-3s}.p4{animation-duration:9s;animation-delay:-7s}.p5{animation-duration:11s;animation-delay:-10s}.p6{animation-duration:8.5s;animation-delay:-4s}.p7{animation-duration:9.5s;animation-delay:-6s}.p8{animation-duration:7s;animation-delay:-2s}.p9{animation-duration:10.5s;animation-delay:-9s}.p10{animation-duration:8s;animation-delay:-1s}.p11{animation-duration:9s;animation-delay:-4s}.p12{animation-duration:11s;animation-delay:-7s}
  </style>
