<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>온이유 · 방송 후원 자동 선택 시연</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171820;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.card{width:min(850px,calc(100% - 32px));padding:28px;border-radius:22px;background:#282532;box-shadow:0 30px 70px #0008}.eyebrow{color:#ffc4d7;font-weight:800;letter-spacing:.12em;font-size:12px}h1{margin:7px 0 8px;font-size:28px}.note{color:#d4cbd7;line-height:1.65}.choices{display:flex;gap:16px;margin:24px 0}.choice{flex:1;padding:16px;border:2px solid #625b70;border-radius:16px;text-align:center;background:#201e29}.choice img{height:220px;max-width:100%;object-fit:contain}.choice b{display:block;font-size:18px}.choice.paid{border-color:#ff86af}.choice.selected{background:#5b2640;border-color:#ffb0ca;box-shadow:0 0 0 5px #ff8cb330}.event{padding:14px;border-radius:12px;background:#15141c;color:#c8c1ce;min-height:24px}.event.ok{color:#fff0f5;background:#783250}button{margin-top:16px;border:0;border-radius:10px;padding:12px 16px;background:#ff7fab;color:#26111a;font-weight:800;font-size:15px;cursor:pointer}small{display:block;margin-top:16px;color:#aaa0b1}</style></head>
<body><main class="card"><div class="eyebrow">SOOP CHAT SDK · REVIEW DEMO</div><h1>별풍선 50개 후원 시 꾸민 의상 자동 확정</h1><p class="note">심사용 시연입니다. 실제 SOOP 로그인, 채팅, 후원, 토큰 저장은 사용하지 않습니다.</p><section class="choices"><div class="choice"><img src="assets/standing/C1-1.png" alt="편한 의상"><b>편한 의상</b></div><div class="choice paid" id="paid"><img src="assets/standing/P1-1.png" alt="꾸민 의상"><b>꾸민 의상</b><span>후원 50개 조건</span></div></section><div class="event" id="event">의상 선택 세션 대기 중 · 실제 서비스에서는 인증 스트리머 본인 방송만 대상</div><button id="trigger">시연: 별풍선 50개 후원 이벤트 수신</button><small>처리 조건: 의상 선택 화면이 열린 상태 · 후원 1회 50개 이상 · 인증된 방송국 ID 일치. 후원자 정보는 저장하지 않습니다.</small></main><script>document.getElementById('trigger').onclick=()=>{const e=document.getElementById('event');document.getElementById('paid').classList.add('selected');e.className='event ok';e.textContent='✓ 별풍선 50개 이벤트 확인 · 꾸민 의상이 자동으로 확정되었습니다.';};</script></body></html>
