<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>당신이 여기에 온 이유</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-season="spring">

  <!-- ============ 타이틀 ============ -->
  <section class="screen is-active" data-screen="title" id="screen-title">
    <div class="title-figure"><img src="assets/standing/s1.png" alt="" draggable="false"></div>
    <div class="title-main">
      <div>
        <p class="title-kicker">힐링 비주얼노벨</p>
        <h1 class="title-name">당신이 여기에 <span class="accent">온 이유</span></h1>
        <p class="title-tag">고등학교 1학년, 같은 반이지만 초면인 두 사람.<br>3년의 계절을 함께 지난다.</p>
      </div>
      <div class="title-menu">
        <button class="title-menu-item is-primary" id="title-new-game">새 게임</button>
        <button class="title-menu-item" id="title-continue">이어하기</button>
        <button class="title-menu-item" id="title-chapters">챕터 선택 (타임머신)</button>
        <button class="title-menu-item" id="title-gallery">갤러리</button>
        <button class="title-menu-item" id="title-settings">설정</button>
        <p class="title-hint">새 게임 시작 시 전체화면으로 전환됩니다</p>
      </div>
    </div>
  </section>

  <!-- ============ 대화 · 선택 ============ -->
  <section class="screen" data-screen="play" id="screen-play">
    <div class="play-bg"></div>
    <div class="particle-layer" id="play-particle-layer"></div>

    <div class="play-topbar">
      <span class="play-chapter-tag" id="play-chapter-tag">CH.01</span>
    </div>

    <div class="play-layout">
      <div class="sprite-wrap" id="play-sprite-wrap"><img id="play-sprite-img" src="assets/standing/s1.png" alt="" draggable="false"></div>

      <div class="play-text-col">
        <div class="dialogue-box" id="dialogue-box">
          <span class="speaker-tag" id="play-speaker-tag" hidden></span>
          <p class="dialogue-line" id="play-dialogue-line"></p>
          <form class="name-form" id="play-name-form" hidden>
            <input type="text" id="play-name-input" placeholder="이름을 입력하세요" maxlength="16" autocomplete="off">
            <button type="submit">확인</button>
          </form>
          <p class="name-error" id="play-name-error"></p>
        </div>
        <p class="play-situation" id="play-situation"></p>
        <div class="choice-list" id="play-choice-list"></div>
      </div>
    </div>
  </section>

  <!-- ============ 회전 안내(모바일 세로 화면일 때만 CSS로 표시) ============ -->
  <div id="rotate-overlay">
    <div class="rotate-icon">📱</div>
    <p>화면을 가로로 돌려주세요</p>
  </div>

  <script src="js/game-data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/save.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
